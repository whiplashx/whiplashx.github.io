<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Josh Neiel C. Manalo |  Portfolio</title>
    <style>
        :root {
            --bg: #0b0c0d;
            --panel: rgba(20, 21, 23, 0.9);
            --panel-strong: rgba(28, 29, 31, 0.98);
            --line: rgba(255, 255, 255, 0.12);
            --green: #f3f4f6;
            --green-deep: #c7c9cc;
            --green-soft: #ffffff;
            --accent: #d1d5db;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --danger: #fca5a5;
            --warning: #f5f5f5;
            --shadow: 0 0 18px rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "JetBrains Mono", "Courier New", Courier, monospace;
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        body::before {
            background: linear-gradient(rgba(255, 255, 255, 0.025) 50%, transparent 50%);
            background-size: 100% 4px;
            opacity: 0.09;
            mix-blend-mode: screen;
        }

        body::after {
            background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.72) 100%);
        }

        #matrix {
            display: none;
        }

        .shell {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }

        .terminal {
            width: min(1100px, 100%);
            height: min(92vh, 980px);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(24, 25, 27, 0.92), rgba(14, 15, 16, 0.98));
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 25px 80px rgba(0, 0, 0, 0.68), var(--shadow);
            backdrop-filter: blur(8px);
        }

        .terminal.hackermode {
            --green: #f9fafb;
            --green-deep: #ffffff;
            --green-soft: #ffffff;
            --accent: #f3f4f6;
            --shadow: 0 0 18px rgba(255, 255, 255, 0.1);
        }

        .chrome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem 1rem;
            background: rgba(1, 7, 3, 0.92);
            border-bottom: 1px solid var(--line);
        }

        .dots {
            display: flex;
            gap: 0.45rem;
            align-items: center;
            min-width: 74px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .dot.red { background: #8b8f97; }
        .dot.yellow { background: #b6bac2; }
        .dot.green { background: #e5e7eb; }

        .chrome-title {
            color: var(--green-soft);
            font-size: 0.82rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.95;
            text-align: center;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chrome-status {
            min-width: 74px;
            text-align: right;
            color: var(--accent);
            font-size: 0.76rem;
            letter-spacing: 0.08em;
        }

        .terminal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .output {
            flex: 1;
            overflow: auto;
            padding: 1.3rem 1.2rem 1rem;
            scrollbar-color: rgba(229, 231, 235, 0.45) transparent;
            scrollbar-width: thin;
        }

        .output::-webkit-scrollbar {
            width: 10px;
        }

        .output::-webkit-scrollbar-thumb {
            background: rgba(229, 231, 235, 0.3);
            border-radius: 999px;
        }

        .line {
            margin-bottom: 0.7rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .line.muted { color: var(--muted); }
        .line.green { color: var(--green); text-shadow: none; }
        .line.soft { color: var(--green-soft); }
        .line.accent { color: var(--accent); }
        .line.warn { color: var(--warning); }
        .line.danger { color: var(--danger); }

        .banner {
            color: var(--green-soft);
            text-shadow: none;
            font-size: clamp(0.62rem, 1.3vw, 0.88rem);
            letter-spacing: 0.05em;
            line-height: 1.2;
            margin-bottom: 1rem;
            white-space: pre;
            overflow-x: auto;
        }

        .welcome {
            display: grid;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .welcome strong {
            color: var(--green-soft);
        }

        .cards {
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            margin: 0.85rem 0 0.3rem;
        }

        .card {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        .card-title {
            margin-bottom: 0.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.78rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-top: 0.5rem;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 0.22rem 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 207, 107, 0.35);
            background: rgba(255, 207, 107, 0.08);
            color: var(--accent);
            font-size: 0.72rem;
        }

        .project-list,
        .history-list {
            display: grid;
            gap: 0.75rem;
        }

        .project {
            border-left: 2px solid rgba(255, 255, 255, 0.24);
            padding: 0.7rem 0.9rem 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0 10px 10px 0;
        }

        .project-head {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.7rem;
            align-items: baseline;
            margin-bottom: 0.35rem;
        }

        .project-name {
            color: var(--green-soft);
            font-weight: 700;
        }

        .project-meta {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .project-desc,
        .history-item,
        .contact-row,
        .help-list,
        .details-list,
        .skills-grid {
            color: #cae9d0;
        }

        .project-link,
        .contact-link,
        .help-link {
            color: var(--green);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.35);
        }

        .project-link:hover,
        .contact-link:hover,
        .help-link:hover {
            color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.7);
        }

        .help-list {
            list-style: none;
            display: grid;
            gap: 0.7rem;
            margin-top: 0.55rem;
        }

        .help-item {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: inherit;
            text-align: left;
            font: inherit;
            cursor: pointer;
            padding: 0.7rem 0.85rem;
            display: grid;
            gap: 0.35rem;
        }

        .help-item:hover {
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.06);
        }

        .help-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .help-item-name {
            color: var(--green-soft);
            font-weight: 700;
        }

        .help-item-note {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .terminal-result {
            display: grid;
            gap: 0.4rem;
            margin-bottom: 1rem;
            padding: 0.15rem 0 0.15rem 0.9rem;
            border-left: 1px solid rgba(255, 255, 255, 0.16);
        }

        .terminal-result-title {
            color: var(--green-soft);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.82rem;
        }

        .terminal-result-body {
            display: grid;
            gap: 0.35rem;
            color: #d7dadf;
            line-height: 1.7;
        }

        .terminal-result-line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .terminal-result-list {
            list-style: none;
            display: grid;
            gap: 0.35rem;
            margin-top: 0.15rem;
        }

        .terminal-result-list li::before {
            content: "> ";
            color: var(--green);
        }

        .terminal-result-label {
            color: var(--green-soft);
        }

        .terminal-result-note {
            color: var(--muted);
        }

        .help-item code,
        .command-chip {
            color: var(--accent);
            font-size: 0.92em;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
        }

        .skills-group {
            padding: 0.85rem 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
        }

        .skills-label {
            color: var(--green-soft);
            margin-bottom: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.74rem;
        }

        .skills-list,
        .details-list,
        .history-list,
        .contact-list {
            list-style: none;
            display: grid;
            gap: 0.45rem;
        }

        .details-list li::before,
        .skills-list li::before,
        .history-list li::before,
        .contact-list li::before {
            content: "> ";
            color: var(--green);
        }

        .split {
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        .section {
            margin-bottom: 1rem;
        }

        .section-title {
            color: var(--green-soft);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 0.7rem;
            font-size: 0.82rem;
        }

        .command-line {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.92rem 1rem;
            border-top: 1px solid var(--line);
            background: rgba(16, 17, 19, 0.96);
        }

        .prompt {
            color: var(--green);
            white-space: nowrap;
            text-shadow: none;
        }

        .command-input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--green-soft);
            font: inherit;
            caret-color: var(--green-soft);
        }

        .caret-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .caret {
            pointer-events: none;
            display: none;
        }

        .command-input::placeholder {
            color: rgba(255, 255, 255, 0.32);
        }

        .input-hint {
            color: var(--muted);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .blip {
            color: var(--accent);
        }

        .terminal a {
            color: inherit;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .line,
        .project,
        .card,
        .help-item,
        .skills-group {
            animation: fadeInUp 0.35s ease both;
        }

        @media (max-width: 780px) {
            .shell {
                padding: 0;
            }

            .terminal {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            .chrome {
                gap: 0.5rem;
                padding: 0.75rem 0.85rem;
            }

            .chrome-title {
                font-size: 0.72rem;
            }

            .chrome-status {
                display: none;
            }

            .output {
                padding: 1rem 0.9rem 0.9rem;
            }

            .command-line {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .input-hint {
                width: 100%;
                white-space: normal;
            }

            .banner {
                font-size: 0.6rem;
            }
        }
    </style>
</head>

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }

        function scrollToBottom() {
            output.scrollTop = output.scrollHeight;
        }

        function appendLine(html, className = "line") {
            const node = document.createElement("div");
            node.className = className;
            node.innerHTML = html;
            output.appendChild(node);
            scrollToBottom();
            return node;
        }

        function appendBlock(className, innerHTML) {
            const node = document.createElement("div");
            node.className = className;
            node.innerHTML = innerHTML;
            output.appendChild(node);
            scrollToBottom();
            return node;
        }

            appendLine(`<div class="banner">${escapeHtml(profile.asciiBanner)}</div>`, "line green");
            appendLine(`<strong class="soft">${escapeHtml(profile.welcomeMessage)}</strong>`, "line soft welcome");
            appendLine(escapeHtml(profile.subtitle), "line muted");
            appendLine(`<span class="blip">${escapeHtml(profile.helpHint)}</span>`, "line accent");
            appendLine(`Session initialized. Type <span class="command-chip">help</span> to list commands.`, "line muted");
        }

        function renderHelp() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">help</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line">Type <span class="command-chip">about</span>, <span class="command-chip">skills</span>, <span class="command-chip">experience</span>, <span class="command-chip">projects</span>, <span class="command-chip">education</span>, <span class="command-chip">resume</span>, <span class="command-chip">contact</span>, or <span class="command-chip">clear</span>.</div>
                        <div class="terminal-result-note">Tip: use <span class="command-chip">projects &lt;number&gt;</span> for full project details.</div>
                    </div>
                </div>
            `);
        }

        function renderAbout() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">about</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">name:</span> ${escapeHtml(profile.person.name)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">title:</span> ${escapeHtml(profile.person.title)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">location:</span> ${escapeHtml(profile.person.location)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">summary:</span> ${escapeHtml(profile.person.summary)}</div>
                    </div>
                </div>
            `);
        }

        function renderSkills() {
            const groups = Object.entries(profile.skills).map(([label, items]) => `
                <div class="terminal-result-line"><span class="terminal-result-label">${escapeHtml(label.toLowerCase())}:</span> ${items.map((item) => escapeHtml(item)).join(", ")}</div>
            `).join("");

            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">skills</div>
                    <div class="terminal-result-body">${groups}</div>
                </div>
            `).join("");
        }

        function renderExperience() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">experience</div>
                    <div class="terminal-result-body">
                        ${profile.experience.map((entry) => `
                            <div class="terminal-result-line"><span class="terminal-result-label">${escapeHtml(entry.title)}</span> · ${escapeHtml(entry.company)} · ${escapeHtml(entry.period)}</div>
                            <ul class="terminal-result-list">
                                ${entry.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join("")}
                            </ul>
                        `).join("")}
                    </div>
                </div>
            `);
        }

        function renderProjects(detailIndex = null) {
            if (detailIndex !== null) {
                const project = profile.projects[detailIndex];
                if (!project) {
                    appendLine(`Project ${detailIndex + 1} not found. Use <span class="command-chip">projects</span> to list all entries.`, "line warn");
                    return;
                }

                appendBlock("line", `
                    <div class="terminal-result">
                        <div class="terminal-result-title">project ${detailIndex + 1}</div>
                        <div class="terminal-result-body">
                            <div class="terminal-result-line"><span class="terminal-result-label">name:</span> ${escapeHtml(project.name)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">tag:</span> ${escapeHtml(project.tag)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">period:</span> ${escapeHtml(project.period)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">employer:</span> ${escapeHtml(project.employer)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">description:</span> ${escapeHtml(project.description)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">stack:</span> ${project.stack.map((item) => escapeHtml(item)).join(", ")}</div>
                            ${project.link ? `<div class="terminal-result-line"><span class="terminal-result-label">link:</span> <a class="project-link" href="${escapeHtml(project.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(project.link)}</a></div>` : ""}
                        </div>
                    </div>
                `);
                return;
            }

            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">projects</div>
                    <div class="terminal-result-body">
                        ${profile.projects.map((project, index) => `
                            <div class="terminal-result-line"><span class="terminal-result-label">${index + 1}. ${escapeHtml(project.name)}</span> · ${escapeHtml(project.tag)}</div>
                            <div class="terminal-result-line terminal-result-note">${escapeHtml(project.period)} · ${escapeHtml(project.employer)}</div>
                            <div class="terminal-result-line terminal-result-note">${escapeHtml(project.description)}</div>
                            <div class="terminal-result-line terminal-result-note">stack: ${project.stack.map((item) => escapeHtml(item)).join(", ")}</div>
                            ${project.link ? `<div class="terminal-result-line terminal-result-note">link: <a class="project-link" href="${escapeHtml(project.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(project.link)}</a></div>` : ""}
                        `).join("")}
                    </div>
                </div>
            `);
        }

        function renderEducation() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">education</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">degree:</span> ${escapeHtml(profile.person.education)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">certifications:</span></div>
                        <ul class="terminal-result-list">
                            ${profile.certifications.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
                        </ul>
                    </div>
                </div>
            `);
        }

        function renderResume() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">resume</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">phone:</span> ${escapeHtml(profile.person.phone)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">email:</span> <a class="contact-link" href="mailto:${escapeHtml(profile.person.email)}">${escapeHtml(profile.person.email)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">github:</span> <a class="contact-link" href="https://${escapeHtml(profile.person.github)}" target="_blank" rel="noopener noreferrer">${escapeHtml(profile.person.github)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">location:</span> ${escapeHtml(profile.person.location)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">summary:</span> ${escapeHtml(profile.person.summary)}</div>
                    </div>
                </div>
            `);
        }

        function renderContact() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">contact</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">email:</span> <a class="contact-link" href="mailto:${escapeHtml(profile.person.email)}">${escapeHtml(profile.person.email)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">phone:</span> ${escapeHtml(profile.person.phone)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">github:</span> <a class="contact-link" href="https://${escapeHtml(profile.person.github)}" target="_blank" rel="noopener noreferrer">${escapeHtml(profile.person.github)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">status:</span> Open for software development opportunities, collaboration, and project work.</div>
                    </div>
                </div>
            `);
        }

        function renderClear() {
            output.innerHTML = "";
            renderIntro();
        }

        function toggleHackermode() {
            hackermode = !hackermode;
            terminal.classList.toggle("hackermode", hackermode);
            statusChip.textContent = hackermode ? "HACKER MODE" : "ONLINE";
            appendLine(hackermode ? "Hackermode activated." : "Hackermode deactivated.", "line danger");
        }

        function renderUnknown(command) {
            appendLine(`Unknown command: <span class="warn">${escapeHtml(command)}</span>. Type <span class="command-chip">help</span> for available commands.`, "line warn");
        }

        function executeCommand(rawValue) {
            const trimmed = rawValue.trim();

            if (!trimmed) {
                return;
            }

            appendLine(`<span class="prompt">${escapeHtml(profile.terminalPrompt)}</span> ${escapeHtml(trimmed)}`, "line green");

            const [head, ...rest] = trimmed.toLowerCase().split(/\s+/);
            const normalized = commandMap.get(head);

            if (!normalized) {
                if (head === "projects" && rest.length) {
                    const index = Number.parseInt(rest[0], 10);
                    if (Number.isFinite(index)) {
                        renderProjects(index - 1);
                        return;
                    }
                }
                renderUnknown(trimmed);
                return;
            }

            switch (normalized) {
                case "help":
                    renderHelp();
                    break;
                case "about":
                    renderAbout();
                    break;
                case "skills":
                    renderSkills();
                    break;
                case "experience":
                    renderExperience();
                    break;
                case "projects": {
                    if (rest.length) {
                        const index = Number.parseInt(rest[0], 10);
                        if (Number.isFinite(index)) {
                            renderProjects(index - 1);
                            break;
                        }
                    }
                    renderProjects();
                    break;
                }
                case "education":
                    renderEducation();
                    break;
                case "resume":
                    renderResume();
                    break;
                case "contact":
                    renderContact();
                    break;
                case "clear":
                    renderClear();
                    break;
                case "hackermode":
                    toggleHackermode();
                    break;
                case "sudo":
                    appendLine(profile.easterEggs.sudo, "line danger");
                    break;
                default:
                    renderUnknown(trimmed);
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const value = input.value;
            if (!value.trim()) {
                return;
            }
            input.value = "";
            history.push(value);
            historyIndex = history.length;
            executeCommand(value);
            input.focus();
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") {
                event.preventDefault();
                if (!history.length) {
                    return;
                }
                historyIndex = Math.max(0, historyIndex - 1);
                input.value = history[historyIndex] ?? "";
                queueMicrotask(() => input.setSelectionRange(input.value.length, input.value.length));
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();
                if (!history.length) {
                    return;
                }
                historyIndex = Math.min(history.length, historyIndex + 1);
                input.value = history[historyIndex] ?? "";
                queueMicrotask(() => input.setSelectionRange(input.value.length, input.value.length));
            }
        });

        output.addEventListener("click", (event) => {
            const target = event.target instanceof Element ? event.target.closest("[data-command]") : null;
            if (!target) {
                return;
            }

            const command = target.getAttribute("data-command");
            if (!command) {
                return;
            }

            input.value = command;
            input.focus();
            form.requestSubmit();
        });

        function boot() {
            renderIntro();
            input.focus();
        }

        window.addEventListener("resize", () => {
            input.focus();
        });

        document.addEventListener("keydown", () => {
            input.focus();
        });

        boot();
    </script>
</body>
</html>
