<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #0b0c0d;
            --panel: rgba(20, 21, 23, 0.9);
            --panel-strong: rgba(28, 29, 31, 0.98);
            --line: rgba(255, 255, 255, 0.12);
            --green: #f3f4f6;
            --green-deep: #c7c9cc;
            --green-soft: #ffffff;
            --accent: #d1d5db;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --danger: #fca5a5;
            --warning: #f5f5f5;
            --shadow: 0 0 18px rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "JetBrains Mono", "Courier New", Courier, monospace;
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        body::before {
            background: linear-gradient(rgba(255, 255, 255, 0.025) 50%, transparent 50%);
            background-size: 100% 4px;
            opacity: 0.09;
            mix-blend-mode: screen;
        }

        body::after {
            background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.72) 100%);
        }

        .shell {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }

        .terminal {
            width: min(1100px, 100%);
            height: min(92vh, 980px);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(24, 25, 27, 0.92), rgba(14, 15, 16, 0.98));
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 25px 80px rgba(0, 0, 0, 0.68), var(--shadow);
            backdrop-filter: blur(8px);
        }

        .terminal.hackermode {
            --green: #34d399;
            --green-deep: #059669;
            --green-soft: #6ee7b7;
            --accent: #10b981;
            --text: #d1fae5;
            --shadow: 0 0 24px rgba(16, 185, 129, 0.25);
        }

        .terminal.hackermode .chrome {
            background: rgba(2, 12, 8, 0.92);
        }

        .chrome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem 1rem;
            background: rgba(1, 7, 3, 0.92);
            border-bottom: 1px solid var(--line);
        }

        .dots {
            display: flex;
            gap: 0.45rem;
            align-items: center;
            min-width: 74px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .dot.red { background: #8b8f97; }
        .dot.yellow { background: #b6bac2; }
        .dot.green { background: #e5e7eb; }

        .chrome-title {
            color: var(--green-soft);
            font-size: 0.82rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.95;
            text-align: center;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chrome-status {
            min-width: 74px;
            text-align: right;
            color: var(--accent);
            font-size: 0.76rem;
            letter-spacing: 0.08em;
        }

        .terminal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .output {
            flex: 1;
            overflow: auto;
            padding: 1.3rem 1.2rem 1rem;
            scrollbar-color: rgba(229, 231, 235, 0.45) transparent;
            scrollbar-width: thin;
        }

        .output::-webkit-scrollbar {
            width: 10px;
        }

        .output::-webkit-scrollbar-thumb {
            background: rgba(229, 231, 235, 0.3);
            border-radius: 999px;
        }

        .line {
            margin-bottom: 0.7rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .line.muted { color: var(--muted); }
        .line.green { color: var(--green); text-shadow: none; }
        .line.soft { color: var(--green-soft); }
        .line.accent { color: var(--accent); }
        .line.warn { color: var(--warning); }
        .line.danger { color: var(--danger); }

        .banner {
            color: var(--green-soft);
            text-shadow: none;
            font-size: clamp(0.62rem, 1.3vw, 0.88rem);
            letter-spacing: 0.05em;
            line-height: 1.2;
            margin-bottom: 1rem;
            white-space: pre;
            overflow-x: auto;
        }

        .welcome {
            display: grid;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .project-link,
        .contact-link {
            color: var(--green);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.35);
        }

        .project-link:hover,
        .contact-link:hover {
            color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.7);
        }

        .project-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            margin-top: 0.35rem;
        }

        .project-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.06);
            color: var(--green-soft);
            text-decoration: none;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .project-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .project-btn::before {
            content: "↗";
        }

        .project-btn.disabled {
            opacity: 0.4;
            border-style: dashed;
            cursor: default;
            pointer-events: none;
        }

        .terminal-result {
            display: grid;
            gap: 0.4rem;
            margin-bottom: 1rem;
            padding: 0.15rem 0 0.15rem 0.9rem;
            border-left: 1px solid rgba(255, 255, 255, 0.16);
        }

        .terminal-result-title {
            color: var(--green-soft);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.82rem;
        }

        .terminal-result-body {
            display: grid;
            gap: 0.35rem;
            color: #d7dadf;
            line-height: 1.7;
        }

        .terminal-result-line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .terminal-result-list {
            list-style: none;
            display: grid;
            gap: 0.35rem;
            margin-top: 0.15rem;
        }

        .terminal-result-list li::before {
            content: "> ";
            color: var(--green);
        }

        .terminal-result-label {
            color: var(--green-soft);
        }

        .terminal-result-note {
            color: var(--muted);
        }

        .project-entry {
            padding: 0.6rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .project-entry:last-child {
            border-bottom: none;
        }

        .command-chip {
            color: var(--accent);
            font-size: 0.92em;
        }

        .command-line {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.92rem 1rem;
            border-top: 1px solid var(--line);
            background: rgba(16, 17, 19, 0.96);
        }

        .prompt {
            color: var(--green);
            white-space: nowrap;
            text-shadow: none;
        }

        .command-input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--green-soft);
            font: inherit;
            caret-color: var(--green-soft);
        }

        .caret-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .command-input::placeholder {
            color: rgba(255, 255, 255, 0.32);
        }

        .input-hint {
            color: var(--muted);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .blip {
            color: var(--accent);
        }

        .terminal a {
            color: inherit;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .line {
            animation: fadeInUp 0.35s ease both;
        }

        @media (prefers-reduced-motion: reduce) {
            .line {
                animation: none;
            }
        }

        @media (max-width: 780px) {
            .shell {
                padding: 0;
            }

            .terminal {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            .chrome {
                gap: 0.5rem;
                padding: 0.75rem 0.85rem;
            }

            .chrome-title {
                font-size: 0.72rem;
            }

            .chrome-status {
                display: none;
            }

            .output {
                padding: 1rem 0.9rem 0.9rem;
            }

            .command-line {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .input-hint {
                width: 100%;
                white-space: normal;
            }

            .banner {
                font-size: 0.6rem;
            }
        }
    </style>
</head>

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }

        function scrollToBottom() {
            output.scrollTop = output.scrollHeight;
        }

        function appendLine(html, className = "line") {
            const node = document.createElement("div");
            node.className = className;
            node.innerHTML = html;
            output.appendChild(node);
            scrollToBottom();
            return node;
        }

        function appendBlock(className, innerHTML) {
            const node = document.createElement("div");
            node.className = className;
            node.innerHTML = innerHTML;
            output.appendChild(node);
            scrollToBottom();
            return node;
        }

            const liveBtn = project.link
                ? `<a class="project-btn" href="${escapeHtml(project.link)}" target="_blank" rel="noopener noreferrer">view live page</a>`
                : `<span class="project-btn disabled">view live page</span>`;
            const githubBtn = project.github
                ? `<a class="project-btn" href="${escapeHtml(project.github)}" target="_blank" rel="noopener noreferrer">view source</a>`
                : "";
            return `<div class="project-buttons">${liveBtn}${githubBtn}</div>`;
        }

        function renderProjects(detailIndex = null) {
            if (detailIndex !== null) {
                const project = profile.projects[detailIndex];
                if (!project) {
                    appendLine(`Project ${detailIndex + 1} not found. Use <span class="command-chip">projects</span> to list all entries (1–${profile.projects.length}).`, "line warn");
                    return;
                }

                appendBlock("line", `
                    <div class="terminal-result">
                        <div class="terminal-result-title">project ${detailIndex + 1} / ${profile.projects.length}</div>
                        <div class="terminal-result-body">
                            <div class="terminal-result-line"><span class="terminal-result-label">name:</span> ${escapeHtml(project.name)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">description:</span> ${escapeHtml(project.description)}</div>
                            <div class="terminal-result-line"><span class="terminal-result-label">stack:</span> ${project.stack.map((item) => escapeHtml(item)).join(", ")}</div>
                            ${projectButtons(project)}
                        </div>
                    </div>
                `);
                return;
            }

            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">projects (${profile.projects.length})</div>
                    <div class="terminal-result-body">
                        ${profile.projects.map((project, index) => `
                            <div class="project-entry">
                                <div class="terminal-result-line"><span class="terminal-result-label">${index + 1}. ${escapeHtml(project.name)}</span></div>
                                <div class="terminal-result-line terminal-result-note">${escapeHtml(project.description)}</div>
                                <div class="terminal-result-line terminal-result-note">stack: ${project.stack.map((item) => escapeHtml(item)).join(", ")}</div>
                                ${projectButtons(project)}
                            </div>
                        `).join("")}
                    </div>
                </div>
            `);
        }

        function renderEducation() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">education</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">degree:</span> ${escapeHtml(profile.person.education)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">certifications:</span></div>
                        <ul class="terminal-result-list">
                            ${profile.certifications.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
                        </ul>
                    </div>
                </div>
            `);
        }

        function renderResume() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">resume</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">phone:</span> ${escapeHtml(profile.person.phone)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">email:</span> <a class="contact-link" href="mailto:${escapeHtml(profile.person.email)}">${escapeHtml(profile.person.email)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">github:</span> <a class="contact-link" href="https://${escapeHtml(profile.person.github)}" target="_blank" rel="noopener noreferrer">${escapeHtml(profile.person.github)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">location:</span> ${escapeHtml(profile.person.location)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">summary:</span> ${escapeHtml(profile.person.summary)}</div>
                    </div>
                </div>
            `);
        }

        function renderContact() {
            appendBlock("line", `
                <div class="terminal-result">
                    <div class="terminal-result-title">contact</div>
                    <div class="terminal-result-body">
                        <div class="terminal-result-line"><span class="terminal-result-label">email:</span> <a class="contact-link" href="mailto:${escapeHtml(profile.person.email)}">${escapeHtml(profile.person.email)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">phone:</span> ${escapeHtml(profile.person.phone)}</div>
                        <div class="terminal-result-line"><span class="terminal-result-label">github:</span> <a class="contact-link" href="https://${escapeHtml(profile.person.github)}" target="_blank" rel="noopener noreferrer">${escapeHtml(profile.person.github)}</a></div>
                        <div class="terminal-result-line"><span class="terminal-result-label">status:</span> Open for software development opportunities, collaboration, and project work.</div>
                    </div>
                </div>
            `);
        }

        function renderClear() {
            output.innerHTML = "";
            renderIntro();
        }

        function toggleHackermode() {
            hackermode = !hackermode;
            terminal.classList.toggle("hackermode", hackermode);
            statusChip.textContent = hackermode ? "HACKER MODE" : "ONLINE";
            appendLine(hackermode ? "Hackermode activated." : "Hackermode deactivated.", "line danger");
        }

        function renderUnknown(command) {
            appendLine(`Unknown command: <span class="warn">${escapeHtml(command)}</span>. Type <span class="command-chip">help</span> for available commands.`, "line warn");
        }

        function executeCommand(rawValue) {
            const trimmed = rawValue.trim();

            if (!trimmed) {
                return;
            }

            appendLine(`<span class="prompt">${escapeHtml(profile.terminalPrompt)}</span> ${escapeHtml(trimmed)}`, "line green");

            const [head, ...rest] = trimmed.toLowerCase().split(/\s+/);
            const normalized = commandMap.get(head);

            if (!normalized) {
                renderUnknown(trimmed);
                return;
            }

            switch (normalized) {
                case "help":
                    renderHelp();
                    break;
                case "about":
                    renderAbout();
                    break;
                case "skills":
                    renderSkills();
                    break;
                case "experience":
                    renderExperience();
                    break;
                case "projects": {
                    if (rest.length) {
                        const index = Number.parseInt(rest[0], 10);
                        if (Number.isFinite(index)) {
                            renderProjects(index - 1);
                            break;
                        }
                    }
                    renderProjects();
                    break;
                }
                case "education":
                    renderEducation();
                    break;
                case "resume":
                    renderResume();
                    break;
                case "contact":
                    renderContact();
                    break;
                case "clear":
                    renderClear();
                    break;
                case "hackermode":
                    toggleHackermode();
                    break;
                case "sudo":
                    appendLine(profile.easterEggs.sudo, "line danger");
                    break;
                default:
                    renderUnknown(trimmed);
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const value = input.value;
            if (!value.trim()) {
                return;
            }
            input.value = "";
            history.push(value);
            historyIndex = history.length;
            executeCommand(value);
            input.focus();
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") {
                event.preventDefault();
                if (!history.length) {
                    return;
                }
                historyIndex = Math.max(0, historyIndex - 1);
                input.value = history[historyIndex] ?? "";
                queueMicrotask(() => input.setSelectionRange(input.value.length, input.value.length));
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();
                if (!history.length) {
                    return;
                }
                historyIndex = Math.min(history.length, historyIndex + 1);
                input.value = history[historyIndex] ?? "";
                queueMicrotask(() => input.setSelectionRange(input.value.length, input.value.length));
            }
        });

        // Refocus the terminal input when the user clicks anywhere in the
        // terminal (but not on a link/button) so typing "just works".
        terminal.addEventListener("click", (event) => {
            const isInteractive = event.target instanceof Element && event.target.closest("a, button");
            if (!isInteractive) {
                input.focus();
            }
        });

        // Refocus on printable keystrokes typed anywhere on the page, but
        // never hijack modifier combos (Ctrl/Cmd+F, Cmd+Tab, etc.) or steal
        // focus from another interactive element the user is deliberately using.
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            const active = document.activeElement;
            if (active && active !== input && active !== document.body) {
                return;
            }
            if (event.key.length === 1 || event.key === "Backspace") {
                input.focus();
            }
        });

        function boot() {
            renderIntro();
            input.focus();
        }

        boot();
    </script>
</body>
</html>
